<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<title>Portfolio</title>
<style>
:root{--navy:#14213D;--cream:#F4EDE0;--coral:#FF6858;--ink:#F4EDE0;--mute:rgba(244,237,224,.72);--card:rgba(255,255,255,.06);--line:rgba(244,237,224,.25);--serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;--sans:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--navy);color:var(--ink);font:300 16px/1.8 var(--sans);letter-spacing:.01em}
a{color:var(--cream);text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 28px}
.nav{position:sticky;top:0;z-index:10;background:rgba(20,33,61,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(244,237,224,.12)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:72px}
.brand{font:italic 400 26px var(--serif);color:var(--cream);letter-spacing:.02em}
.nav nav a{color:var(--cream);margin-left:28px;font-size:11px;text-transform:uppercase;letter-spacing:.22em;opacity:.8;transition:.25s}
.nav nav a:hover{color:var(--coral);opacity:1}
section{padding:110px 0;border-top:1px solid rgba(244,237,224,.1)}
h2{font:400 clamp(30px,4.5vw,42px)/1.15 var(--serif);margin-bottom:40px;letter-spacing:.01em}
h2::after{content:"";display:block;width:46px;height:1px;background:var(--coral);margin-top:16px}
#home{min-height:92vh;display:flex;align-items:center;border-top:0;background:radial-gradient(circle at 85% 15%,rgba(255,104,88,.13),transparent 45%)}
.hi{color:var(--coral);font-size:12px;text-transform:uppercase;letter-spacing:.35em}
h1{font:400 clamp(52px,9vw,96px)/1.02 var(--serif);margin:14px 0 14px;letter-spacing:-.01em}
.type{font:italic 400 clamp(22px,3.6vw,32px) var(--serif);min-height:1.5em;color:var(--mute)}
.type b{color:var(--cream);font-weight:400}
.cursor{display:inline-block;width:1px;height:1em;background:var(--coral);margin-left:4px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{max-width:540px;margin:26px 0 38px;color:var(--mute)}
.btn{display:inline-block;padding:14px 32px;border:1px solid var(--coral);background:transparent;color:var(--coral);cursor:pointer;font:400 11px var(--sans);text-transform:uppercase;letter-spacing:.22em;transition:.3s;margin:0 8px 8px 0}
.btn:hover{background:var(--coral);color:var(--navy)}
.btn.ghost{border-color:rgba(244,237,224,.45);color:var(--cream)}
.btn.ghost:hover{border-color:var(--cream);background:var(--cream);color:var(--navy)}
.tags{display:flex;flex-wrap:wrap;gap:12px}
.tag{padding:8px 18px;border:1px solid var(--line);color:var(--cream);font-size:12px;text-transform:uppercase;letter-spacing:.14em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:26px}
.card{background:transparent;border:1px solid var(--line);padding:32px 28px;transition:.3s}
.card:hover{border-color:var(--coral);background:rgba(244,237,224,.03)}
.card h3{font:400 24px/1.2 var(--serif);margin-bottom:12px}
.card p{color:var(--mute);font-size:15px}
.plinks{margin-top:16px;display:flex;gap:22px;font-size:11px;text-transform:uppercase;letter-spacing:.16em}.plinks a{border-bottom:1px solid var(--coral);padding-bottom:2px}
.tech{margin-top:16px;color:var(--coral);font-size:11px;text-transform:uppercase;letter-spacing:.16em}
.edu{border-left:1px solid var(--coral);padding:2px 0 2px 24px;margin-bottom:28px}
.edu strong{font:400 22px var(--serif)}
.edu small{color:var(--mute);font-size:14px}
footer{border-top:1px solid rgba(244,237,224,.12);padding:32px 0;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.2em}
footer .wrap{display:flex;justify-content:space-between;align-items:center}
#lock{background:none;border:0;cursor:pointer;opacity:.18;padding:6px;transition:.2s}
#lock:hover,#lock:focus{opacity:.9}
#lock svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:1.5}
/* hidden editor */
#ov{display:none;position:fixed;inset:0;z-index:50;background:var(--navy);overflow:auto}
#ov.on{display:block}
.panel{max-width:760px;margin:0 auto;padding:34px 22px 80px}
.panel h2{margin-bottom:20px}
.panel h3{margin:34px 0 10px;color:var(--cream);font:400 22px var(--serif)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 0}
input,textarea{width:100%;margin-top:4px;padding:10px 12px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:0;color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--cream)}
textarea{min-height:80px;resize:vertical}
.row{border:1px solid var(--line);border-radius:0;padding:12px 14px;margin-top:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.msg{margin-top:12px;font-size:14px;color:var(--coral);min-height:20px}
.msg.ok{color:var(--cream)}
.gate{max-width:380px;margin:18vh auto 0;padding:0 22px}
.note{color:var(--mute);font-size:13px;margin-top:14px}
@media(max-width:600px){.nav .wrap{height:auto;padding-top:12px;padding-bottom:12px;flex-direction:column;gap:4px}.nav nav{display:flex;flex-wrap:wrap;justify-content:center}.nav nav a{margin:0 9px;font-size:10px;letter-spacing:.14em}section{padding:72px 0}.wrap{padding:0 20px}footer{letter-spacing:.1em}.plinks{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="nav"><div class="wrap"><a class="brand" href="#home" id="brand"></a>
<nav><a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#education">Education</a><a href="#contact">Contact</a></nav></div></div>
<main id="app"></main>
<footer><div class="wrap"><span id="foot"></span>
<button id="lock" aria-label="Open editor" title=""><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button></div></footer>
<div id="ov"></div>

<script id="data" type="application/json">{
"name":"Nakul",
"roles":["AI / ML Enthusiast","Data Science Learner","Data Analytics Aspirant"],
"intro":"Final-year B.Tech student building practical machine learning projects end to end. Looking for fresher and internship roles in AI/ML, Data Science and Data Analytics.",
"about":"I am a final-year Computer Science and Engineering (Artificial Intelligence) student at ABES Institute of Technology, Ghaziabad. I learn by building: I like taking a problem, working through the data, training and testing models, and putting the result behind a simple app or API.",
"skills":["Python","scikit-learn","TensorFlow","Keras","spaCy","NLTK","XGBoost","LangChain","FastAPI","Flask","PostgreSQL","Tableau"],
"projects":[
{"title":"Fake News / Clickbait Detection","tech":"Python, spaCy, NLTK, scikit-learn","link":"","desc":"NLP project on news articles using lemmatization, TF-IDF and POS features with Logistic Regression and LinearSVC, with ablation tests to check for data leakage."},
{"title":"Credit Card Fraud Detection","tech":"Random Forest, XGBoost, SMOTE","link":"","desc":"Compares Random Forest and XGBoost on a heavily imbalanced dataset, using SMOTE and judging results with ROC-AUC and precision-recall."},
{"title":"Loan Defaulter Prediction","tech":"Python, FastAPI, HTML/CSS/JS","link":"","desc":"Credit risk prediction on a synthetic dataset with several models tested, served through a FastAPI backend and a dark-theme web UI."},
{"title":"Solar AI (Final-Year Project)","tech":"SAM / U-Net, NASA POWER API, XGBoost","link":"","desc":"Group project that assesses rooftop solar potential using image segmentation, irradiance data and a savings prediction model."},
{"title":"CreditStore","tech":"Flask, PostgreSQL","link":"","desc":"E-commerce store where every user gets 2,000 credit points to spend."}
],
"education":[
{"title":"B.Tech, CSE (Artificial Intelligence)","detail":"ABES Institute of Technology, Ghaziabad | 2023 - 2027 | CGPA 7.35/10 through third year"},
{"title":"Data Analytics Job Simulation","detail":"Deloitte Australia (Forage) | Tableau dashboards"}
],
"email":"","github":"","linkedin":""
}</script>
<script id="vault" type="application/json">null</script>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"";
let data=JSON.parse($('#data').textContent),
    vault=JSON.parse($('#vault').textContent);
try{const p=localStorage.getItem('pf_public'),v=localStorage.getItem('pf_vault');if(p){const L=JSON.parse(p);if((L._v||0)>=(data._v||0)){data=L;if(v)vault=JSON.parse(v)}}else if(!vault&&v)vault=JSON.parse(v)}catch(e){}

/* ---------- typing animation ---------- */
let typeTimer;
function startTyping(roles){
  clearTimeout(typeTimer);
  const el=$('#typed');if(!el||!roles.length)return;
  let r=0,i=0,del=false;
  (function tick(){
    const w=roles[r];
    el.textContent=w.slice(0,i);
    let d=del?35:85;
    if(!del&&i===w.length){del=true;d=1400}
    else if(del&&i===0){del=false;r=(r+1)%roles.length;d=350}
    else i+=del?-1:1;
    typeTimer=setTimeout(tick,d);
  })();
}

/* ---------- render public site ---------- */
function render(){
  const d=data;
  document.title=d.name+" | Portfolio";
  $('#brand').textContent=d.name;
  $('#foot').textContent="© "+new Date().getFullYear()+" "+d.name;
  const links=[["Email",d.email&&"mailto:"+d.email],["GitHub",safeUrl(d.github)],["LinkedIn",safeUrl(d.linkedin)]].filter(x=>x[1]);
  $('#app').innerHTML=`
  <section id="home"><div class="wrap">
    <div class="hi">Hello, I'm</div><h1>${esc(d.name)}</h1>
    <div class="type"><b id="typed"></b><span class="cursor"></span></div>
    <p class="lead">${esc(d.intro)}</p>
    <a class="btn" href="#projects">View Projects</a> <a class="btn ghost" href="#contact">Contact Me</a>
  </div></section>
  <section id="about"><div class="wrap"><h2>About</h2><p style="max-width:720px;color:var(--mute)">${esc(d.about)}</p></div></section>
  <section id="skills"><div class="wrap"><h2>Skills</h2><div class="tags">${d.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div></div></section>
  <section id="projects"><div class="wrap"><h2>Projects</h2><div class="grid">${d.projects.map(p=>`
    <div class="card"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><div class="tech">${esc(p.tech)}</div>
    ${(safeUrl(p.github)||safeUrl(p.link))?`<p class="plinks">${safeUrl(p.github)?`<a href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener">GitHub &rarr;</a>`:""}${safeUrl(p.link)?`<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">Live demo &rarr;</a>`:""}</p>`:""}</div>`).join("")}</div></div></section>
  <section id="education"><div class="wrap"><h2>Education</h2>${d.education.map(e=>`<div class="edu"><strong>${esc(e.title)}</strong><br><small>${esc(e.detail)}</small></div>`).join("")}</div></section>
  <section id="contact"><div class="wrap"><h2>Contact</h2>
    ${links.length?`<div class="tags">${links.map(l=>`<a class="btn ghost" href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join("")}</div>`:`<p style="color:var(--mute)">Contact details are not added yet.</p>`}
  </div></section>`;
  startTyping(d.roles);
}

/* ---------- crypto (PBKDF2 + AES-GCM) ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(code,salt){
  const k=await crypto.subtle.importKey('raw',TE.encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,code){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(code,salt),TE.encode(JSON.stringify(obj)));
  return {s:b64(salt),i:b64(iv),c:b64(ct)};
}
async function unseal(v,code){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(v.i)},await deriveKey(code,unb(v.s)),unb(v.c));
  return JSON.parse(TD.decode(pt));
}

/* ---------- hidden editor ---------- */
const ov=$('#ov');let secret=null;
$('#lock').onclick=()=>{ov.classList.add('on');gate()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
function closeOv(){ov.classList.remove('on');ov.innerHTML='';secret=null}
function gate(){
  const first=!vault;
  ov.innerHTML=`<div class="gate"><h2>${first?'Create secret code':'Enter secret code'}</h2>
  <label>Secret code<input id="c1" type="password" autocomplete="off"></label>
  ${first?'<label>Confirm code<input id="c2" type="password" autocomplete="off"></label><p class="note">At least 6 characters. If you forget it, the saved editor data cannot be recovered.</p>':''}
  <div class="msg" id="gm"></div>
  <div class="bar"><button class="btn" id="go">${first?'Create':'Unlock'}</button><button class="btn ghost" id="x">Close</button></div></div>`;
  $('#x').onclick=closeOv;
  const go=async()=>{
    const m=$('#gm'),c=$('#c1').value;
    if(!(window.crypto&&crypto.subtle)){m.textContent="Encryption needs a secure context (https or a local file in a modern browser).";return}
    try{
      if(first){
        if(c.length<6){m.textContent="Use at least 6 characters.";return}
        if(c!==$('#c2').value){m.textContent="Codes do not match.";return}
        vault=await seal(data,c);localStorage.setItem('pf_vault',JSON.stringify(vault));
        secret=c;editor(data);
      }else{
        m.textContent="Unlocking...";
        const d=await unseal(vault,c);secret=c;editor(d);
      }
    }catch(e){m.textContent="Wrong code or storage unavailable."}
  };
  $('#go').onclick=go;ov.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  $('#c1').focus();
}
const fld=(l,k,v)=>`<label>${l}<input data-k="${k}" value="${esc(v)}"></label>`;
const area=(l,k,v)=>`<label>${l}<textarea data-k="${k}">${esc(v)}</textarea></label>`;
const projRow=p=>`<div class="row" data-g="projects">${fld('Title','title',p.title)}${fld('Tech used','tech',p.tech)}${fld('GitHub URL (https://github.com/...)','github',p.github)}${fld('Live demo link (optional)','link',p.link)}${area('Description','desc',p.desc)}<div class="bar"><button class="btn ghost rm" type="button">Remove</button></div></div>`;
const eduRow=e=>`<div class="row" data-g="education">${fld('Title','title',e.title)}${fld('Details','detail',e.detail)}<div class="bar"><button class="btn ghost rm" type="button">Remove</button></div></div>`;
function editor(d){
  ov.innerHTML=`<div class="panel"><h2>Edit your portfolio</h2>
  <h3>Intro</h3>${fld('Name','name',d.name)}${fld('Typing lines (separate with commas)','roles',d.roles.join(', '))}${area('Intro text','intro',d.intro)}
  <h3>About</h3>${area('About text','about',d.about)}
  <h3>Skills</h3>${fld('Skills (separate with commas)','skills',d.skills.join(', '))}
  <h3>Projects</h3><div id="pl">${d.projects.map(projRow).join('')}</div><div class="bar"><button class="btn ghost" id="ap" type="button">+ Add project</button></div>
  <h3>Education</h3><div id="el">${d.education.map(eduRow).join('')}</div><div class="bar"><button class="btn ghost" id="ae" type="button">+ Add entry</button></div>
  <h3>Contact</h3>${fld('Email','email',d.email)}${fld('GitHub URL','github',d.github)}${fld('LinkedIn URL','linkedin',d.linkedin)}
  <h3>Secret code</h3><label>New secret code (leave empty to keep current)<input id="nc" type="password" autocomplete="off"></label>
  <div class="msg" id="em"></div>
  <div class="bar"><button class="btn" id="sv">Save changes</button><button class="btn ghost" id="dl">Download updated HTML</button><button class="btn ghost" id="lk">Lock &amp; close</button></div>
  <p class="note">Saving updates this browser only. To keep changes permanently, download the updated HTML and use that file as your site.</p></div>`;
  const q=(r,k)=>r.querySelector(`[data-k="${k}"]`).value.trim();
  const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
  const grab=()=>({
    name:q(ov,'name')||'Your Name',roles:list(q(ov,'roles')),intro:q(ov,'intro'),about:q(ov,'about'),skills:list(q(ov,'skills')),
    projects:[...ov.querySelectorAll('[data-g=projects]')].map(r=>({title:q(r,'title'),tech:q(r,'tech'),github:q(r,'github'),link:q(r,'link'),desc:q(r,'desc')})),
    education:[...ov.querySelectorAll('[data-g=education]')].map(r=>({title:q(r,'title'),detail:q(r,'detail')})),
    email:q(ov,'email'),github:q(ov,'github'),linkedin:q(ov,'linkedin')
  });
  const say=(t,ok)=>{const m=$('#em');m.textContent=t;m.className='msg'+(ok?' ok':'')};
  ov.onclick=e=>{if(e.target.classList.contains('rm'))e.target.closest('.row').remove()};
  $('#ap').onclick=()=>$('#pl').insertAdjacentHTML('beforeend',projRow({title:'',tech:'',link:'',desc:''}));
  $('#ae').onclick=()=>$('#el').insertAdjacentHTML('beforeend',eduRow({title:'',detail:''}));
  const save=async()=>{
    const nc=$('#nc').value;
    if(nc){if(nc.length<6){say('New code needs at least 6 characters.');return false}secret=nc;$('#nc').value=''}
    data=grab();data._v=Date.now();
    vault=await seal(data,secret);
    try{localStorage.setItem('pf_public',JSON.stringify(data));localStorage.setItem('pf_vault',JSON.stringify(vault))}catch(e){say('Could not save in this browser. Use Download instead.')}
    render();say('Saved.',true);return true;
  };
  $('#sv').onclick=save;
  $('#lk').onclick=closeOv;
  $('#dl').onclick=async()=>{
    if(!(await save()))return;
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';c.querySelector('#ov').innerHTML='';c.querySelector('#ov').className='';
    c.querySelector('#brand').textContent='';c.querySelector('#foot').textContent='';
    const j=o=>JSON.stringify(o).replace(/</g,'\\u003c');
    c.querySelector('#data').textContent=j(data);c.querySelector('#vault').textContent=j(vault);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));
    a.download='portfolio.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
}
render();
</script>
</body>
</html>
