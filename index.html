<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<title>Portfolio</title>
<style>
:root{--bg:#060a13;--bg2:#0b1220;--ink:#e8eef9;--mute:#9aa8c0;--c1:#22d3ee;--c2:#8b5cf6;--c3:#f472b6;--line:rgba(148,163,200,.18);--glass:rgba(15,23,42,.55);--grad:linear-gradient(120deg,var(--c1),var(--c2) 55%,var(--c3));--head:"Space Grotesk","Inter",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--sans:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:300 16px/1.75 var(--sans);overflow-x:hidden}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.glow{position:fixed;z-index:0;pointer-events:none;width:60vmax;height:60vmax;border-radius:50%;filter:blur(120px);opacity:.16}
.g1{background:var(--c2);top:-25vmax;right:-20vmax}.g2{background:var(--c1);bottom:-30vmax;left:-25vmax;opacity:.1}
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--grad);z-index:30}
main,footer,.nav{position:relative;z-index:1}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}
.nav{position:sticky;top:0;z-index:20;background:rgba(6,10,19,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;height:68px}
.brand{font:700 20px var(--head);letter-spacing:.02em}
.brand::before{content:"</>";font:500 13px var(--mono);color:var(--c1);margin-right:10px}
.nav nav a{font:400 12px var(--mono);color:var(--mute);margin-left:26px;transition:.25s;position:relative}
.nav nav a:hover{color:var(--c1)}
section{padding:120px 0;position:relative}
.eyebrow{font:400 13px var(--mono);color:var(--c1);margin-bottom:10px;display:block}
.eyebrow i{color:var(--mute);font-style:normal}
h2{font:700 clamp(30px,4.6vw,44px)/1.15 var(--head);margin-bottom:44px;letter-spacing:-.01em}
#home{min-height:94vh;display:flex;align-items:center;padding:60px 0}
.hi{font:400 14px var(--mono);color:var(--c1)}
.hi::after{content:" _";animation:blink 1s steps(1) infinite}
h1{font:700 clamp(56px,11vw,124px)/1 var(--head);margin:16px 0 18px;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shift 8s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 0}}
.type{font:400 clamp(17px,2.8vw,24px) var(--mono);color:var(--mute);min-height:1.6em}
.type b{color:var(--ink);font-weight:500}
.type::before{content:"$ ";color:var(--c2)}
.cursor{display:inline-block;width:9px;height:1.05em;background:var(--c1);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{max-width:580px;margin:28px 0 38px;color:var(--mute);font-size:17px}
.btn{display:inline-block;padding:13px 26px;border-radius:10px;border:1px solid transparent;background:var(--grad);color:#05070d;cursor:pointer;font:500 13px var(--mono);transition:.25s;margin:0 10px 10px 0}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(34,211,238,.5)}
.btn.ghost{background:var(--glass);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--c1);color:var(--c1);box-shadow:none}
.about{display:grid;grid-template-columns:1fr;max-width:780px;padding:34px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(10px);color:var(--mute);font-size:17px;position:relative}
.about::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:2px;background:var(--grad);border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:12px}
.tag{padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font:400 13px var(--mono);transition:.25s}
.tag:hover{border-color:var(--c1);color:var(--c1);transform:translateY(-3px);box-shadow:0 8px 24px -10px var(--c1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.card{--mx:50%;--my:50%;position:relative;padding:30px 26px 26px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(10px);overflow:hidden;transition:transform .3s,border-color .3s;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(34,211,238,.13),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.card:hover{transform:translateY(-6px);border-color:rgba(34,211,238,.5)}
.card:hover::before{opacity:1}
.num{font:500 12px var(--mono);color:var(--c2);margin-bottom:14px}
.card h3{font:700 22px/1.25 var(--head);margin-bottom:12px}
.card p{color:var(--mute);font-size:15px;flex:1}
.tech{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tech span{font:400 11px var(--mono);padding:4px 10px;border-radius:6px;background:rgba(139,92,246,.14);color:#c4b5fd}
.plinks{margin-top:18px;display:flex;gap:20px;font:500 12px var(--mono)}.plinks a{color:var(--c1)}.plinks a:hover{color:var(--c3)}
.tl{position:relative;padding-left:28px;max-width:780px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--c1),var(--c2),transparent)}
.edu{position:relative;padding:4px 0 30px}
.edu::before{content:"";position:absolute;left:-29px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 4px rgba(34,211,238,.18)}
.edu strong{font:500 21px var(--head);display:block}
.edu small{color:var(--mute);font:400 13px/1.7 var(--mono)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font:400 12px var(--mono)}
footer .wrap{display:flex;justify-content:space-between;align-items:center}
#lock{background:none;border:0;cursor:pointer;opacity:.18;padding:6px;transition:.2s}
#lock:hover,#lock:focus{opacity:.9}
#lock svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.5}
/* hidden editor */
#ov{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
#ov.on{display:block}
.panel{max-width:760px;margin:0 auto;padding:34px 22px 80px}
.panel h2{margin-bottom:20px}
.panel h3{margin:34px 0 10px;font:700 20px var(--head);color:var(--c1)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 0}
input,textarea{width:100%;margin-top:4px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--c1)}
textarea{min-height:80px;resize:vertical}
.row{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.msg{margin-top:12px;font-size:14px;color:var(--c3);min-height:20px}
.msg.ok{color:var(--c1)}
.gate{max-width:380px;margin:18vh auto 0;padding:0 22px}
.note{color:var(--mute);font-size:13px;margin-top:14px}
@media(max-width:640px){.nav .wrap{height:auto;padding-top:12px;padding-bottom:12px;flex-direction:column;gap:4px}.nav nav{display:flex;flex-wrap:wrap;justify-content:center}.nav nav a{margin:0 9px;font-size:11px}section{padding:76px 0}.wrap{padding:0 20px}.about{padding:26px 22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"";
const resumeUrl=u=>/^https?:\/\//i.test(u)||/^[\w\-. \/]+\.pdf$/i.test(u)?u:"";
let data=JSON.parse($('#data').textContent),
    vault=JSON.parse($('#vault').textContent);
try{const p=localStorage.getItem('pf_public'),v=localStorage.getItem('pf_vault');if(p){const L=JSON.parse(p);if((L._v||0)>=(data._v||0)){data=L;if(v)vault=JSON.parse(v)}}else if(!vault&&v)vault=JSON.parse(v)}catch(e){}

/* ---------- neural network background ---------- */
(function(){
  const cv=$('#bg'),cx=cv.getContext('2d'),m={x:-999,y:-999};let W,H,P=[];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;const n=Math.min(95,Math.floor(W*H/17000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
  addEventListener('resize',size);addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});
  function frame(){
    cx.clearRect(0,0,W,H);
    for(const p of P){if(!reduce){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
    for(let i=0;i<P.length;i++){
      const a=P[i];
      cx.fillStyle='rgba(34,211,238,.7)';cx.beginPath();cx.arc(a.x,a.y,1.6,0,6.283);cx.fill();
      for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){cx.strokeStyle='rgba(139,92,246,'+(.28*(1-d/130))+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
      const dm=Math.hypot(a.x-m.x,a.y-m.y);if(dm<170){cx.strokeStyle='rgba(34,211,238,'+(.5*(1-dm/170))+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(m.x,m.y);cx.stroke()}
    }
    if(!reduce)requestAnimationFrame(frame)
  }
  size();frame();
})();
addEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});

/* ---------- typing animation ---------- */
let typeTimer;
function startTyping(roles){
  clearTimeout(typeTimer);
  const el=$('#typed');if(!el||!roles.length)return;
  let r=0,i=0,del=false;
  (function tick(){
    const w=roles[r];
    el.textContent=w.slice(0,i);
    let d=del?30:75;
    if(!del&&i===w.length){del=true;d=1400}
    else if(del&&i===0){del=false;r=(r+1)%roles.length;d=350}
    else i+=del?-1:1;
    typeTimer=setTimeout(tick,d);
  })();
}

/* ---------- render public site ---------- */
const pad=n=>String(n+1).padStart(2,'0');
function render(){
  const d=data;
  document.title=d.name+" | Portfolio";
  $('#brand').textContent=d.name;
  $('#foot').textContent="© "+new Date().getFullYear()+" "+d.name;
  const rl=resumeUrl(d.resume??"resume.pdf");
  const links=[["Resume",rl],["Email",d.email&&"mailto:"+d.email],["GitHub",safeUrl(d.github)],["LinkedIn",safeUrl(d.linkedin)]].filter(x=>x[1]);
  $('#app').innerHTML=`
  <section id="home"><div class="wrap">
    <div class="hi">&gt; hello, I'm</div><h1>${esc(d.name)}</h1>
    <div class="type"><b id="typed"></b><span class="cursor"></span></div>
    <p class="lead">${esc(d.intro)}</p>
    <a class="btn" href="#projects">View Projects</a><a class="btn ghost" href="#contact">Contact Me</a>${rl?`<a class="btn ghost" href="${esc(rl)}" target="_blank" rel="noopener">View Resume</a>`:""}
  </div></section>
  <section id="about"><div class="wrap rv"><span class="eyebrow">01 <i>/</i> about</span><h2>About</h2><p class="about">${esc(d.about)}</p></div></section>
  <section id="skills"><div class="wrap rv"><span class="eyebrow">02 <i>/</i> skills</span><h2>Skills</h2><div class="tags">${d.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div></div></section>
  <section id="projects"><div class="wrap"><div class="rv"><span class="eyebrow">03 <i>/</i> projects</span><h2>Projects</h2></div><div class="grid">${d.projects.map((p,i)=>`
    <div class="card rv"><div class="num">${pad(i)}</div><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
    <div class="tech">${String(p.tech||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
    ${(safeUrl(p.github)||safeUrl(p.link))?`<p class="plinks" style="flex:none">${safeUrl(p.github)?`<a href="${esc(safeUrl(p.github))}" target="_blank" rel="noopener">GitHub &rarr;</a>`:""}${safeUrl(p.link)?`<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">Live demo &rarr;</a>`:""}</p>`:""}</div>`).join("")}</div></div></section>
  <section id="education"><div class="wrap rv"><span class="eyebrow">04 <i>/</i> education</span><h2>Education</h2><div class="tl">${d.education.map(e=>`<div class="edu"><strong>${esc(e.title)}</strong><small>${esc(e.detail)}</small></div>`).join("")}</div></div></section>
  <section id="contact"><div class="wrap rv"><span class="eyebrow">05 <i>/</i> contact</span><h2>Contact</h2>
    ${links.length?`<div class="tags">${links.map(l=>`<a class="btn ghost" href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]}</a>`).join("")}</div>`:`<p style="color:var(--mute)">Contact details are not added yet.</p>`}
  </div></section>`;
  startTyping(d.roles);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(el.classList.contains('card')?(i%3)*90:0)+'ms';io.observe(el)});
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}));
}

/* ---------- crypto (PBKDF2 + AES-GCM) ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(code,salt){
  const k=await crypto.subtle.importKey('raw',TE.encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(obj,code){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(code,salt),TE.encode(JSON.stringify(obj)));
  return {s:b64(salt),i:b64(iv),c:b64(ct)};
}
async function unseal(v,code){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(v.i)},await deriveKey(code,unb(v.s)),unb(v.c));
  return JSON.parse(TD.decode(pt));
}

/* ---------- hidden editor ---------- */
const ov=$('#ov');let secret=null;
$('#lock').onclick=()=>{ov.classList.add('on');gate()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});
function closeOv(){ov.classList.remove('on');ov.innerHTML='';secret=null}
function gate(){
  const first=!vault;
  ov.innerHTML=`<div class="gate"><h2>${first?'Create secret code':'Enter secret code'}</h2>
  <label>Secret code<input id="c1" type="password" autocomplete="off"></label>
  ${first?'<label>Confirm code<input id="c2" type="password" autocomplete="off"></label><p class="note">At least 6 characters. If you forget it, the saved editor data cannot be recovered.</p>':''}
  <div class="msg" id="gm"></div>
  <div class="bar"><button class="btn" id="go">${first?'Create':'Unlock'}</button><button class="btn ghost" id="x">Close</button></div></div>`;
  $('#x').onclick=closeOv;
  const go=async()=>{
    const m=$('#gm'),c=$('#c1').value;
    if(!(window.crypto&&crypto.subtle)){m.textContent="Encryption needs a secure context (https or a local file in a modern browser).";return}
    try{
      if(first){
        if(c.length<6){m.textContent="Use at least 6 characters.";return}
        if(c!==$('#c2').value){m.textContent="Codes do not match.";return}
        vault=await seal(data,c);localStorage.setItem('pf_vault',JSON.stringify(vault));
        secret=c;editor(data);
      }else{
        m.textContent="Unlocking...";
        const d=await unseal(vault,c);secret=c;editor(d);
      }
    }catch(e){m.textContent="Wrong code or storage unavailable."}
  };
  $('#go').onclick=go;ov.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  $('#c1').focus();
}
const fld=(l,k,v)=>`<label>${l}<input data-k="${k}" value="${esc(v)}"></label>`;
const area=(l,k,v)=>`<label>${l}<textarea data-k="${k}">${esc(v)}</textarea></label>`;
const projRow=p=>`<div class="row" data-g="projects">${fld('Title','title',p.title)}${fld('Tech used','tech',p.tech)}${fld('GitHub URL (https://github.com/...)','github',p.github)}${fld('Live demo link (optional)','link',p.link)}${area('Description','desc',p.desc)}<div class="bar"><button class="btn ghost rm" type="button">Remove</button></div></div>`;
const eduRow=e=>`<div class="row" data-g="education">${fld('Title','title',e.title)}${fld('Details','detail',e.detail)}<div class="bar"><button class="btn ghost rm" type="button">Remove</button></div></div>`;
function editor(d){
  ov.innerHTML=`<div class="panel"><h2>Edit your portfolio</h2>
  <h3>Intro</h3>${fld('Name','name',d.name)}${fld('Typing lines (separate with commas)','roles',d.roles.join(', '))}${area('Intro text','intro',d.intro)}
  <h3>About</h3>${area('About text','about',d.about)}
  <h3>Skills</h3>${fld('Skills (separate with commas)','skills',d.skills.join(', '))}
  <h3>Projects</h3><div id="pl">${d.projects.map(projRow).join('')}</div><div class="bar"><button class="btn ghost" id="ap" type="button">+ Add project</button></div>
  <h3>Education</h3><div id="el">${d.education.map(eduRow).join('')}</div><div class="bar"><button class="btn ghost" id="ae" type="button">+ Add entry</button></div>
  <h3>Contact</h3>${fld('Email','email',d.email)}${fld('GitHub URL','cgithub',d.github)}${fld('LinkedIn URL','linkedin',d.linkedin)}${fld('Resume link (resume.pdf in your repo, or a https:// link; empty hides the button)','resume',d.resume??'resume.pdf')}
  <h3>Publish to your live website</h3>
  <p class="note" style="margin-top:0">Saves your changes into your GitHub repo so every visitor sees them (takes a few minutes). Use a fine-grained token limited to this one repo with Contents: Read and write.</p>
  ${fld('GitHub username','gu','')}${fld('Repository name','gr','')}${fld('Branch','gb','main')}
  <label>Access token<input id="gt" type="password" autocomplete="off"></label>
  <label style="display:flex;gap:8px;align-items:center"><input id="gk" type="checkbox" style="width:auto;margin:0"> Remember token on this device (stored encrypted with your secret code)</label>
  <h3>Secret code</h3><label>New secret code (leave empty to keep current)<input id="nc" type="password" autocomplete="off"></label>
  <div class="msg" id="em"></div>
  <div class="bar"><button class="btn" id="pb">Publish to website</button><button class="btn ghost" id="sv">Save in this browser</button><button class="btn ghost" id="dl">Download updated HTML</button><button class="btn ghost" id="lk">Lock &amp; close</button></div>
  <p class="note">Save only updates this browser. Use Publish to website so every visitor sees your changes. Download HTML is a manual backup.</p></div>`;
  const q=(r,k)=>r.querySelector(`[data-k="${k}"]`).value.trim();
  const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
  const grab=()=>({
    name:q(ov,'name')||'Your Name',roles:list(q(ov,'roles')),intro:q(ov,'intro'),about:q(ov,'about'),skills:list(q(ov,'skills')),
    projects:[...ov.querySelectorAll('[data-g=projects]')].map(r=>({title:q(r,'title'),tech:q(r,'tech'),github:q(r,'github'),link:q(r,'link'),desc:q(r,'desc')})),
    education:[...ov.querySelectorAll('[data-g=education]')].map(r=>({title:q(r,'title'),detail:q(r,'detail')})),
    email:q(ov,'email'),github:q(ov,'cgithub'),linkedin:q(ov,'linkedin'),resume:q(ov,'resume')
  });
  const say=(t,ok)=>{const m=$('#em');m.textContent=t;m.className='msg'+(ok?' ok':'')};
  ov.onclick=e=>{if(e.target.classList.contains('rm'))e.target.closest('.row').remove()};
  $('#ap').onclick=()=>$('#pl').insertAdjacentHTML('beforeend',projRow({title:'',tech:'',link:'',desc:''}));
  $('#ae').onclick=()=>$('#el').insertAdjacentHTML('beforeend',eduRow({title:'',detail:''}));
  const save=async()=>{
    const nc=$('#nc').value;
    if(nc){if(nc.length<6){say('New code needs at least 6 characters.');return false}secret=nc;$('#nc').value=''}
    data=grab();data._v=Date.now();
    vault=await seal(data,secret);
    try{localStorage.setItem('pf_public',JSON.stringify(data));localStorage.setItem('pf_vault',JSON.stringify(vault))}catch(e){say('Could not save in this browser. Use Download instead.')}
    render();say('Saved.',true);return true;
  };
  $('#sv').onclick=save;
  const gh=(()=>{try{return JSON.parse(localStorage.getItem('pf_gh')||'{}')}catch(e){return{}}})();
  const setv=(k,v)=>{if(v)ov.querySelector(`[data-k="${k}"]`).value=v};
  setv('gu',gh.owner);setv('gr',gh.repo);setv('gb',gh.branch);
  try{const t=localStorage.getItem('pf_tok');if(t)unseal(JSON.parse(t),secret).then(o=>{$('#gt').value=o.t;$('#gk').checked=true}).catch(()=>{})}catch(e){}
  $('#pb').onclick=async()=>{
    const owner=q(ov,'gu'),repo=q(ov,'gr'),branch=q(ov,'gb')||'main',tok=$('#gt').value.trim();
    if(!owner||!repo||!tok){say('Fill in GitHub username, repository and token.');return}
    if(!(await save()))return;
    say('Publishing...',true);
    const api=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/data.json`;
    const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
    try{
      let sha;const g=await fetch(api+'?ref='+encodeURIComponent(branch),{headers:H,cache:'no-store'});
      if(g.ok)sha=(await g.json()).sha;else if(g.status!==404){say('GitHub replied '+g.status+'. Check username, repo name and token.');return}
      const body={message:'Update portfolio content',branch,content:b64(TE.encode(JSON.stringify({data,vault})))};if(sha)body.sha=sha;
      const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok){say('Publish failed ('+r.status+'). The token needs Contents: Read and write on this repo.');return}
      localStorage.setItem('pf_gh',JSON.stringify({owner,repo,branch}));
      if($('#gk').checked)localStorage.setItem('pf_tok',JSON.stringify(await seal({t:tok},secret)));else localStorage.removeItem('pf_tok');
      say('Published. Visitors will see it in a few minutes.',true);
    }catch(e){say('Could not reach GitHub. Check your connection.')}
  };
  $('#lk').onclick=closeOv;
  $('#dl').onclick=async()=>{
    if(!(await save()))return;
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';c.querySelector('#ov').innerHTML='';c.querySelector('#ov').className='';
    c.querySelector('#brand').textContent='';c.querySelector('#foot').textContent='';
    const j=o=>JSON.stringify(o).replace(/</g,'\\u003c');
    c.querySelector('#data').textContent=j(data);c.querySelector('#vault').textContent=j(vault);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));
    a.download='portfolio.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
}
render();
fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(R=>{if(R&&R.data&&(R.data._v||0)>(data._v||0)){data=R.data;if(R.vault)vault=R.vault;render()}}).catch(()=>{});
</script>
</body>
</html>
